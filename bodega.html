<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos - Gafas de Sol</title>
    <!-- Enlace a la hoja de estilos externa -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CONTENEDOR PRINCIPAL: Envuelve todos los productos. -->
    <main class="products-container">

        <!-- ================= PRODUCTO 1 ================= -->
        <article class="product-card">
            <div class="image-container">
                <img src="img-1.png" alt="Nuevas Gafas de Sol Premium" class="product-image">
                <div class="savings-tag">
                    <span class="tag-icon">🏷️</span> AHORRAS L 270
                </div>
            </div>

            <div class="product-info">
                <h2 class="product-title">NUEVAS GAFAS DE SOL PREMIUM</h2>
                <div class="rating">
                    <span class="stars">★★★★★</span>
                    <span class="reviews-count">(5)</span>
                </div>
                <div class="price-container">
                    <span class="current-price">L 1270.00</span>
                    <span class="old-price">L 1540.00</span>
                </div>
            </div>
        </article>

        <!-- ================= PRODUCTO 2 ================= -->
        <article class="product-card">
            <div class="image-container">
                <img src="img-2.png" alt="Gafas de Sol Deportivas" class="product-image">
                <div class="savings-tag">
                    <span class="tag-icon">🏷️</span> AHORRAS L 150
                </div>
            </div>

            <div class="product-info">
                <h2 class="product-title">GAFAS DE SOL DEPORTIVAS PRO</h2>
                <div class="rating">
                    <span class="stars">★★¼☆☆</span>
                    <span class="reviews-count">(12)</span>
                </div>
                <div class="price-container">
                    <span class="current-price">L 850.00</span>
                    <span class="old-price">L 1000.00</span>
                </div>
            </div>
        </article>

    </main> <!-- Fin del contenedor principal -->


    <!-- ================= BOTÓN FLOTANTE DE WHATSAPP ================= -->
    <!-- 
        Instrucciones de configuración:
        1. Cambia el número '50499999999' por tu número real (incluyendo el código de país, ej: 504 para Honduras).
        2. En el 'text=', puedes editar el mensaje automático reemplazando los espacios por '%20'.
    -->
    <a href="https://wa.me/50498886488?text=Hola,%20estoy%20interesado%20en%20hacer%20un%20pedido%20de%20las%20Gafas%20de%20Sol." 
       class="btn-whatsapp" 
       target="_blank" 
       rel="noopener noreferrer">
        <!-- Icono/Emoji de WhatsApp dentro de un círculo -->
        <span class="whatsapp-icon">💬</span>
        <span class="whatsapp-text">Pedir por WhatsApp</span>
    </a>

</body>
</html>
